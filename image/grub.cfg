set timeout=0
set default_slot=a
set next_slot=
load_env --file /amafu/grubenv default_slot next_slot
set slot="${default_slot}"
if [ -n "${next_slot}" ]; then
    set slot="${next_slot}"
    set next_slot=
    save_env --file /amafu/grubenv next_slot
fi
set kernel_arguments="console=ttyS0 panic=10 initcall_blacklist=kho_init"
if [ -f /amafu-${slot}/kernel-arguments.cfg ]; then
    source /amafu-${slot}/kernel-arguments.cfg
fi
linux /amafu-${slot}/vmlinuz ${kernel_arguments} amafu.slot=${slot}
initrd /amafu-${slot}/initramfs
boot
