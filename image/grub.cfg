set timeout=0
set default_slot=a
set next_slot=
load_env --file /amafu/grubenv default_slot next_slot
set slot="${default_slot}"
if [ -n "${next_slot}" ]; then
    set slot="${next_slot}"
    set next_slot=
    save_env --file /amafu/grubenv next_slot
fi
linux /amafu-${slot}/vmlinuz console=ttyS0 panic=10 quiet initcall_blacklist=kho_init amafu.slot=${slot}
initrd /amafu-${slot}/initramfs
boot
