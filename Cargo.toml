[workspace]
members = ["crates/*", "test-rig/*"]
exclude = ["crates/api/fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"
publish = false

[workspace.dependencies]
amafu-domain = { path = "crates/domain" }
amafu-interfaces = { path = "crates/interfaces" }
amafu-reconciler = { path = "crates/reconciler" }
amafu-controllers = { path = "crates/controllers" }
amafu-state = { path = "crates/state" }
amafu-storage = { path = "crates/storage" }
amafu-hypervisor = { path = "crates/hypervisor" }
amafu-api = { path = "crates/api" }
amafu-system = { path = "crates/system" }
amafu-network = { path = "crates/network" }
amafu-node = { path = "crates/node" }
amafu-scenario = { path = "test-rig/scenario" }
amafu-simulated-world = { path = "test-rig/simulated-world" }
amafu-checkers = { path = "test-rig/checkers" }
amafu-lxd-lab = { path = "test-rig/lxd-lab" }
amafu-scenarios = { path = "test-rig/scenarios" }

anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "matched-path"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
hex = { version = "0.4.3", features = ["serde"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "service", "http1", "http2"] }
proptest = "1.12.0"
crc32fast = "1.5"
quorium = { git = "https://github.com/canonical/quorium", rev = "b0a97b08a9bffebf0c977692f5ac5dd64dd9fd7a", default-features = false }
rand = "0.10.3"
rand_chacha = "0.10.0"
rcgen = "0.14.10"
rtnetlink = "0.23.0"
socket2 = { version = "0.6.5", features = ["all"] }
tun-rs = { version = "2.8.16", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider", "http2", "stream"] }
rustix = { version = "1.1.6", features = ["fs", "mount", "process", "system"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
tar = "0.4.46"
flate2 = "1.1.10"
webpki-roots = "1.0.11"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "process", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
await_holding_lock = "deny"
min_ident_chars = "deny"
disallowed_names = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unused_async_trait_impl = "allow"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
